<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="TLS와 mTLS, 자바 스레드 풀을 그림과 시뮬레이터로 익히는 LLM 위키 학습 서재">
<title>학습 서재 | LLM 위키</title>
<style>
:root{color-scheme:light;--ink:#172e2b;--muted:#485e58;--line:#bac4b8;--paper:#faf9f2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:1rem/1.6 "DM Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all}
main{max-width:68rem;margin:auto;padding:clamp(1.3rem,5vw,4rem)}
header{padding:1rem 0 clamp(2rem,6vw,4.5rem);border-top:3px solid var(--ink)}
.brand{font:600 1.1rem Georgia,serif;letter-spacing:.04em}
h1{font-size:clamp(2.8rem,8vw,5rem);line-height:1.1;letter-spacing:-.065em;margin:2.8rem 0 .8rem}
p{margin:0;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,21rem),1fr));gap:1.6rem}
a{color:inherit;text-decoration:none;display:flex;flex-direction:column;gap:.6rem;border-top:1px solid var(--line);padding-top:.85rem}
a:focus-visible{outline:3px solid #874624;outline-offset:5px}
a:hover h2{text-decoration:underline;text-underline-offset:.2em}
.cover{height:10rem;display:flex;align-items:center;justify-content:center;gap:.6rem;margin-bottom:.6rem;border-radius:.25rem;color:#194e46;background:#deebe1}
.queue{background:#f1e4cd;color:#845124}
.endpoint,.worker,.job{display:grid;place-items:center;border:2px solid currentColor;font:600 1rem/1.3 ui-monospace,monospace}
.endpoint{width:2.9rem;height:2.9rem;border-radius:50%}
.wire{font:1.7rem/1 monospace}
.worker{width:2.8rem;height:3.3rem;border-radius:.4rem}
.jobs{display:flex;gap:.2rem;border-block:2px solid currentColor;padding:.28rem 0}
.job{width:.68rem;height:1.35rem;background:currentColor;border-radius:.12rem}
.kind{font-size:.85rem;font-weight:650;color:var(--muted)}
h2{font-size:clamp(1.35rem,3vw,1.75rem);letter-spacing:-.035em;line-height:1.35;margin:0;text-wrap:balance}
</style>
</head>
<body><main>
<header>
<span class="brand">LLM Wiki</span>
<h1>학습 서재</h1>
<p>그림을 넘기고 조건을 바꾸며 소프트웨어의 동작을 살펴보세요.</p>
</header>
<nav aria-label="학습 작품">
<a href="tls-mtls-deck.html">
<div class="cover" aria-hidden="true"><span class="endpoint">C</span><span class="wire">⟷</span><span class="endpoint">S</span></div>
<span class="kind">네트워크 보안 / 그림책</span>
<h2>TLS와 mTLS에서는 누가 누구를 확인할까?</h2>
<p>핸드셰이크를 한 단계씩 넘기며 인증서가 오가는 순간을 따라갑니다.</p>
</a>
<a href="thread-pool-deck.html">
<div class="cover queue" aria-hidden="true"><span class="jobs"><i class="job"></i><i class="job"></i><i class="job"></i></span><span class="wire">→</span><span class="worker">T₁</span><span class="worker">T₂</span></div>
<span class="kind">JVM 동시성 / 시뮬레이터</span>
<h2>스레드 풀의 상한을 올려도 왜 스레드가 늘지 않을까?</h2>
<p>큐 크기를 바꾸고 작업을 넣어 어떤 작업이 대기하고 언제 새 스레드가 생기는지 확인합니다.</p>
</a>
</nav>
</main></body>
</html>
